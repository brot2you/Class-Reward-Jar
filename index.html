<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163f3b"><title>Class Reward Jars — School Life</title><style>
:root{font-family:Trebuchet MS,Arial,sans-serif;color:#f9f6e9;background:#e8e1cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#d4e5e6a8,#e4d6b9a8),repeating-linear-gradient(90deg,#e9d9b7 0 110px,#e2d1aa 110px 114px)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffce56;outline-offset:3px}.app{max-width:1220px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#143e3b;border:7px solid #bd8b53;box-shadow:0 7px 0 #755432,0 14px 22px #0002;border-radius:12px;padding:15px 22px}.top h1{font-size:clamp(24px,4vw,43px);margin:0;font-weight:900;letter-spacing:.5px}.top small{display:block;color:#d3e8d9;font-size:14px;margin-top:4px}.top button,.pill{border:2px solid #b7d2cc;background:#245d58;color:white;border-radius:12px;padding:11px 16px;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.9fr);gap:22px;margin-top:24px}.board{background:linear-gradient(145deg,#174e46,#103b36);border:14px solid #b67c40;border-radius:16px;box-shadow:inset 0 0 0 3px #d2a56a,0 14px 30px #0003;padding:20px;min-height:670px;position:relative;overflow:hidden}.board:before{content:'✦  A little progress every day  ✦';display:block;text-align:center;color:#d6e7d8;font-size:clamp(15px,2vw,23px);font-weight:800;letter-spacing:1px}.classrow{display:flex;gap:12px;align-items:center;justify-content:center;margin:20px auto 0}.classrow select{width:min(270px,75%);border-radius:40px;background:#fff6df;border:4px solid #9d6936;color:#23463f;padding:12px;font-weight:900;text-align:center;font-size:19px}.round{border:3px solid #b7d2cc;border-radius:50%;background:#28635c;color:white;font-size:24px;width:44px;height:44px}.jar-zone{height:390px;display:flex;justify-content:center;align-items:center;position:relative}.jar{width:240px;height:310px;position:relative;filter:drop-shadow(0 12px 9px #0005);transition:transform .25s}.jar.pop{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.06) rotate(-2deg)}}.lid{position:absolute;z-index:5;top:7px;left:13px;width:214px;height:31px;border:5px solid #8a693f;border-radius:12px;background:linear-gradient(#f9d997,#bd8747);box-shadow:0 5px 0 #6b5135}.glass{position:absolute;top:30px;bottom:5px;left:17px;right:17px;border:8px solid #a9dbe0;border-top:4px solid #e1f7f7;border-bottom:12px solid #8cbac3;border-radius:35px 35px 54px 54px;background:linear-gradient(110deg,#ffffff90,#a8e8f326 40%,#d7ffff45 75%,#ffffff77);overflow:hidden;box-shadow:inset 12px 0 13px #fff8,inset -9px 0 13px #347c8a44}.glass:after{content:'';position:absolute;left:15px;top:18px;width:17px;height:170px;border-radius:90%;background:#fff8;transform:rotate(7deg)}.tokens{position:absolute;inset:12px 9px 7px;display:flex;align-content:flex-end;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:0;overflow:hidden}.token{width:37px;height:37px;display:grid;place-items:center;font-size:27px;filter:drop-shadow(1px 3px 1px #0004);animation:drop .35s ease both}@keyframes drop{from{transform:translateY(-110px) rotate(60deg);opacity:0}to{transform:translateY(0);opacity:1}}.counter{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);z-index:6;background:#fdf5dd;border:4px solid #b58a50;border-radius:30px;color:#284942;font-weight:900;padding:8px 28px;font-size:25px;white-space:nowrap;box-shadow:0 5px 0 #78552f}.action{display:block;margin:6px auto 14px;border:4px solid #b9d6d4;border-radius:17px;padding:13px 24px;background:linear-gradient(#238fa4,#11647a);box-shadow:0 5px 0 #063e49;color:#fff;font-size:23px;font-weight:900}.action:active{transform:translateY(3px);box-shadow:0 2px 0 #063e49}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.nav button{border:3px solid #d6b375;background:#f8edce;color:#21453e;border-radius:12px;padding:10px 16px;font-weight:900}.panel{background:#f7f0d8;color:#20423c;border:9px solid #ae804b;border-radius:15px;box-shadow:inset 0 0 0 2px #dfbd84,0 12px 25px #0002;padding:20px;min-height:560px}.panel h2{font-size:28px;margin:0 0 18px;text-align:center}.field{display:block;margin:13px 0;font-weight:800}.field span{display:block;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:2px solid #b8ad90;border-radius:9px;background:#fffdf6;color:#193d37}.check{display:flex;gap:9px;align-items:center;margin:14px 0;font-weight:700}.check input{width:19px;height:19px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tool{border:2px solid #a8bdb4;border-radius:10px;padding:10px 12px;background:#e3f0e7;color:#1e4b42;font-weight:800}.tool.warn{background:#fce9df;border-color:#e7aa8d;color:#803b29}.hint{font-size:13px;line-height:1.5;color:#527067}.list{max-height:370px;overflow:auto}.entry{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #b9c5b7}.entry small{color:#667c70}.reward{padding:13px;border-radius:12px;background:#e1efe2;margin:14px 0;font-weight:800}.empty{color:#6b8174;text-align:center;padding:25px}.foot{text-align:center;color:#35564e;font-weight:800;margin:24px}.hidden{display:none!important}.success{color:#256a46;font-weight:800}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}.mini{padding:7px 11px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px}.modal>div{background:#fff9e9;color:#24443d;padding:26px;border:8px solid #bc8a51;border-radius:20px;max-width:430px;width:100%;text-align:center;box-shadow:0 20px 70px #0005}.modal h2{font-size:28px}.modal p{line-height:1.5}@media(max-width:840px){.layout{grid-template-columns:1fr}.board{min-height:610px}.panel{min-height:0}.app{padding:10px}.top{padding:13px}.top h1{font-size:25px}.jar-zone{height:360px}.board:before{font-size:15px}}@media(max-width:390px){.jar{transform:scale(.88)}.jar.pop{animation:none}.nav button{padding:8px}.board{padding:10px}}
</style></head><body><div class="app"><header class="top"><div><h1>🏆 Class Reward Jars</h1><small id="subtitle">School Life Edition · by Brot2you</small></div><button id="settingsBtn">⚙ Settings</button></header><div class="layout"><main class="board"><div class="classrow"><button class="round" id="prev" aria-label="Previous class">‹</button><select id="classSelect" aria-label="Choose class"></select><button class="round" id="next" aria-label="Next class">›</button></div><div class="jar-zone"><div class="jar" id="jar"><div class="lid"></div><div class="glass"><div class="tokens" id="tokens"></div></div></div><div class="counter" id="counter">0 / 20</div></div><button class="action" id="add">✚ Good Action!</button><div class="nav"><button data-view="classes">👥 Classes</button><button data-view="history">📖 History</button><button data-view="rewards">🏆 Rewards</button><button data-view="settings">⚙ Settings</button></div></main><aside class="panel" id="panel"></aside></div><div class="foot">Class Reward Jars · School Life · by Brot2you</div></div><div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div><h2 id="modalTitle"></h2><p id="modalText"></p><div class="tools" style="justify-content:center"><button class="tool" id="modalCancel">Cancel</button><button class="tool warn" id="modalConfirm">Confirm</button></div></div></div><input type="file" id="importFile" accept="application/json,.json" hidden><script>
(()=>{'use strict';const KEY='brot2you_class_reward_jars_school_life_v1';const $=id=>document.getElementById(id);const makeClass=(name)=>({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,goal:20,points:0,reward:'Class choice activity',style:'balls',history:[],rewards:0});let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.classes)||!state.classes.length)state={classes:[makeClass('Class 5A'),makeClass('Class 5B'),makeClass('Class 4A')],selected:0,showFrench:false,sound:true};state.selected=Math.min(Math.max(state.selected||0,0),state.classes.length-1);let view='settings',confirmAction=null;const current=()=>state.classes[state.selected],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Local storage is unavailable. Please export a backup.')}};const tr=(en,fr)=>en+(state.showFrench?` <small style="font-weight:normal;color:#6b7c70">(${fr})</small>`:'');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sound(){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(650,a.currentTime);o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.12);g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.18);o.onended=()=>a.close()}catch{}}function render(){const c=current();$('classSelect').innerHTML=state.classes.map((x,i)=>`<option value="${i}" ${i===state.selected?'selected':''}>${esc(x.name)}</option>`).join('');$('counter').textContent=`${c.points} / ${c.goal}`;const icons={balls:'🔵',stars:'⭐',books:'📚',leaves:'🍃',gems:'💎'};$('tokens').innerHTML=Array.from({length:Math.min(c.points,150)},(_,i)=>`<span class="token" style="animation-delay:${Math.min(i*.008,.2)}s">${icons[c.style]||'🔵'}</span>`).join('');$('add').disabled=c.points>=c.goal;$('add').textContent=c.points>=c.goal?'🏆 Goal Reached!':'✚ Good Action!';$('subtitle').textContent='School Life Edition · by Brot2you';renderPanel();save()}function renderPanel(){const c=current(),p=$('panel');if(view==='settings'){p.innerHTML=`<h2>⚙ ${tr('Settings','Paramètres')}</h2><label class="field"><span>${tr('Class name','Nom de classe')}</span><input id="name" maxlength="45" value="${esc(c.name)}"></label><label class="field"><span>${tr('Jar goal','Objectif')}</span><input id="goal" type="number" min="1" max="150" value="${c.goal}"></label><label class="field"><span>${tr('Reward','Récompense')}</span><input id="reward" maxlength="120" value="${esc(c.reward)}"></label><label class="field"><span>${tr('Jar style','Style de jarre')}</span><select id="style">${[['balls','Colorful balls'],['stars','Golden stars'],['books','Books'],['leaves','Leaves'],['gems','Gems']].map(([v,l])=>`<option value="${v}" ${c.style===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="check"><input type="checkbox" id="french" ${state.showFrench?'checked':''}>Show French subtitles</label><label class="check"><input type="checkbox" id="sound" ${state.sound?'checked':''}>Sound effects</label><div class="tools"><button class="tool" id="export">⇩ ${tr('Export backup','Exporter')}</button><button class="tool" id="import">⇧ ${tr('Import backup','Importer')}</button><button class="tool warn" id="reset">↻ ${tr('Reset this class','Réinitialiser')}</button></div><p class="hint">Changes are saved automatically on this device. Export a backup to move between devices or browsers.</p>`;['name','goal','reward','style'].forEach(id=>$(id).addEventListener('change',()=>{let v=$(id).value;if(id==='goal')v=Math.max(1,Math.min(150,Number(v)||20));c[id==='name'?'name':id]=v;if(c.points>c.goal)c.points=c.goal;render()}));$('french').onchange=e=>{state.showFrench=e.target.checked;render()};$('sound').onchange=e=>{state.sound=e.target.checked;render()};$('export').onclick=exportData;$('import').onclick=()=>$('importFile').click();$('reset').onclick=()=>ask('Reset this class?',`Reset ${c.name} to 0? Previous reward history will be kept.`,()=>{c.points=0;c.history.unshift({at:new Date().toISOString(),type:'reset'});render()})}else if(view==='classes'){p.innerHTML=`<h2>👥 ${tr('Manage Classes','Gestion des classes')}</h2><div class="list">${state.classes.map((x,i)=>`<div class="entry"><div><b>${esc(x.name)}</b><br><small>${x.points}/${x.goal} · ${x.rewards} rewards</small></div><div><button class="tool mini" data-pick="${i}">Open</button> <button class="tool mini warn" data-delete="${i}">✕</button></div></div>`).join('')}</div><label class="field"><span>${tr('New class','Nouvelle classe')}</span><input id="newName" maxlength="45" placeholder="e.g. Class 3B"></label><button class="tool" id="newClass">＋ Add class</button><p class="hint">Create as many classes as you need. Each class has its own jar, goal, reward and history.</p>`;p.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.pick;view='settings';render()});p.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const i=+b.dataset.delete;if(state.classes.length===1){alert('Keep at least one class.');return}ask('Delete class?',`Permanently delete ${state.classes[i].name} and its history?`,()=>{state.classes.splice(i,1);state.selected=Math.min(state.selected,state.classes.length-1);render()})});$('newClass').onclick=()=>{const n=$('newName').value.trim();if(!n)return;state.classes.push(makeClass(n));state.selected=state.classes.length-1;view='settings';render()}}else if(view==='history'){p.innerHTML=`<h2>📖 ${tr('History','Historique')}</h2><p>${esc(c.name)} · ${c.history.length} events</p><div class="list">${c.history.length?c.history.map(h=>`<div class="entry"><span>${h.type==='add'?'⭐ Good action':h.type==='undo'?'↶ Action removed':h.type==='reward'?'🏆 Reward earned':'↻ Jar reset'}</span><small>${new Date(h.at).toLocaleString()}</small></div>`).join(''):'<p class="empty">No actions yet.</p>'}</div><div class="tools"><button class="tool" id="undo">↶ Undo last action</button></div>`;$('undo').onclick=undo}else{p.innerHTML=`<h2>🏆 ${tr('Rewards','Récompenses')}</h2><div class="reward">🎁 ${esc(c.reward)}</div><p><b>${tr('Rewards earned','Récompenses obtenues')}:</b> ${c.rewards}</p><p><b>${tr('Current progress','Progression actuelle')}:</b> ${c.points} / ${c.goal}</p><p class="hint">When the jar reaches its goal, a celebration appears. Confirm to record the reward and start a new jar.</p><div class="list">${c.history.filter(x=>x.type==='reward').map(x=>`<div class="entry">🏆 ${esc(x.reward||'Reward')}<small>${new Date(x.at).toLocaleDateString()}</small></div>`).join('')||'<p class="empty">No rewards earned yet.</p>'}</div>`}}function ask(title,msg,fn){$('modalTitle').textContent=title;$('modalText').textContent=msg;confirmAction=fn;$('modal').classList.remove('hidden')}function close(){confirmAction=null;$('modal').classList.add('hidden')}$('modalCancel').onclick=close;$('modalConfirm').onclick=()=>{const fn=confirmAction;close();fn&&fn()};function add(){const c=current();if(c.points>=c.goal)return;c.points++;c.history.unshift({type:'add',at:new Date().toISOString()});$('jar').classList.remove('pop');void $('jar').offsetWidth;$('jar').classList.add('pop');sound();render();if(c.points===c.goal)ask('🎉 Goal reached!',`${c.name} earned: ${c.reward}. Record the reward and start a fresh jar?`,()=>{c.rewards++;c.history.unshift({type:'reward',reward:c.reward,at:new Date().toISOString()});c.points=0;render()})}function undo(){const c=current();if(c.points<=0)return;c.points--;c.history.unshift({type:'undo',at:new Date().toISOString()});render()}function exportData(){const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='class-reward-jars-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.classes)||!x.classes.length||x.classes.length>500||x.classes.some(c=>typeof c.name!=='string'||!Number.isInteger(c.goal)||c.goal<1||c.goal>150||!Number.isInteger(c.points)||c.points<0||c.points>c.goal||!Array.isArray(c.history)))throw Error('Invalid backup');ask('Import backup?',`Replace current data with ${x.classes.length} classes?`,()=>{state={classes:x.classes,selected:0,showFrench:!!x.showFrench,sound:x.sound!==false};render()})}catch{alert('Invalid backup file.')}e.target.value=''};$('classSelect').onchange=e=>{state.selected=+e.target.value;render()};$('prev').onclick=()=>{state.selected=(state.selected-1+state.classes.length)%state.classes.length;render()};$('next').onclick=()=>{state.selected=(state.selected+1)%state.classes.length;render()};$('add').onclick=add;$('settingsBtn').onclick=()=>{view='settings';render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();})();
</script></body></html>
