current=()=>state.classes[state.selected],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Local storage is unavailable. Please export a backup.')}};const tr=(en,fr)=>en+(state.showFrench?` <small style="font-weight:normal;color:#6b7c70">(${fr})</small>`:'');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sound(){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(650,a.currentTime);o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.12);g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.18);o.onended=()=>a.close()}catch{}}function render(){const c=current();$('classSelect').innerHTML=state.classes.map((x,i)=>`<option value="${i}" ${i===state.selected?'selected':''}>${esc(x.name)}</option>`).join('');$('counter').textContent=`${c.points} / ${c.goal}`;const icons={balls:'🔵',stars:'⭐',books:'📚',leaves:'🍃',gems:'💎'};const n=Math.min(c.points,150),goal=Math.max(1,Math.min(c.goal,150));const cols=Math.max(3,Math.ceil(Math.sqrt(goal*.85))),rows=Math.ceil(goal/cols);const starSize=Math.round(Math.min(104,255/(1+0.62*(cols-1)),195/(1+0.44*(rows-1))));const dx=starSize*.62,dy=starSize*.44;const fullWidth=starSize+(cols-1)*dx,fullHeight=starSize+(rows-1)*dy;const x0=(255-fullWidth)/2,y0=Math.max(0,(195-fullHeight)*.04);$('tokens').innerHTML=Array.from({length:n},(_,i)=>{const row=Math.floor(i/cols),col=i%cols;const inRow=Math.min(cols,goal-row*cols);const shift=(cols-inRow)*dx/2;const jitterX=Math.sin(i*17.13)*Math.min(5,starSize*.07),jitterY=Math.cos(i*12.7)*Math.min(4,starSize*.06);const x=x0+shift+col*dx+jitterX,y=y0+row*dy+jitterY;return `<span class="token" style="--size:${starSize}px;--x:${(x/255*100).toFixed(2)}%;--y:${(y/195*100).toFixed(2)}%;--layer:${row*cols+col+1};--kx:${((i%12)%4)*100/3}%;--ky:${Math.floor((i%12)/4)*50}%;animation-delay:${Math.min(i*.005,.15)}s;--twinkle-time:${(3.3+(i*13%19)/7).toFixed(1)}s;--twinkle-delay:${(-i*.63).toFixed(2)}s"><img src="assets/star-${(i*7+Math.floor(i/5))%30}.png" alt="star"></span>`}).join('');$('add').disabled=c.points>=c.goal;$('add').textContent=c.points>=c.goal?'🏆 Goal Reached!':'✚ Good Action!';$('subtitle').textContent='School Life Edition';renderPanel();save()}function renderPanel(){const c=current(),p=$('panel');if(view==='actions'){p.innerHTML=`<h2 class="good-actions-title">👍 Good Actions <small>Select the action(s) completed · Choisis les bonnes actions réalisées</small></h2><div class="good-grid">${actionCatalog().map(([emoji,en,fr],i)=>`<button type="button" class="good-tile ${chosen.has(i)?'selected':''}" data-good="${i}" aria-pressed="${chosen.has(i)}"><span class="tick">${chosen.has(i)?'✓':''}</span><span class="emoji">${esc(emoji)}</span><b>${esc(en)}</b><small>${esc(fr)}</small></button>`).join('')}</div><div class="good-buttons"><button class="apply" id="applyGood" ${chosen.size===0?'disabled':''}>✓ Add to the Jar (${chosen.size})</button><button class="clear" id="clearGood">↻ Clear selection</button></div><p class="good-info">Each selected action adds one star to the current class jar.</p><button class="tool" id="editActions">✎ Create / manage my good actions</button>`;p.querySelectorAll('[data-good]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.good);if(chosen.has(i))chosen.delete(i);else chosen.add(i);renderPanel()});$('clearGood').onclick=()=>{chosen.clear();renderPanel()};$('editActions').onclick=()=>{view='actionEditor';chosen.clear();renderPanel()};$('applyGood').onclick=()=>{const selected=[...chosen];chosen.clear();for(const i of selected){if(current().points>=current().goal)break;add(actionCatalog()[i][1])}render()}}else if(view==='actionEditor'){const customs=Array.isArray(c.customActions)?c.customActions:[];p.innerHTML=`<h2>✎ My Good Actions <small style="display:block;font-size:13px">Mes bonnes actions personnalisées · ${esc(c.name)}</small></h2><p class="hint">Create your own actions and choose an icon. They are saved for this class and included in backups.</p><label class="field"><span>Action name (English)</span><input id="customEn" maxlength="55" placeholder="e.g. Helping a classmate"></label><label class="field"><span>French subtitle (optional)</span><input id="customFr" maxlength="65" placeholder="Aider un camarade"></label><div class="field"><span>Choose an icon</span><div class="icon-picker">${ICONS.map((ic,i)=>`<button type="button" class="icon-option ${i===0?'active':''}" data-icon="${i}" aria-label="Icon ${i+1}">${ic}</button>`).join('')}</div></div><div class="tools"><button class="tool" id="saveCustom">＋ Add good action</button><button class="tool" id="backActions">← Back to actions</button></div><h3>My actions (${customs.length})</h3><div class="list">${customs.map((a,i)=>`<div class="entry"><span>${esc(a.icon)} <b>${esc(a.en)}</b><br><small>${esc(a.fr||'')}</small></span><button class="tool mini warn" data-remove-custom="${i}">Delete</button></div>`).join('')||'<p class="empty">No custom actions yet.</p>'}</div>`;let iconChoice=ICONS[0];p.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{iconChoice=ICONS[Number(b.dataset.icon)];p.querySelectorAll('[data-icon]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('saveCustom').onclick=()=>{const en=$('customEn').value.trim(),fr=$('customFr').value.trim();if(!en){alert('Please enter an action name.');return}if(!Array.isArray(c.customActions))c.customActions=[];c.customActions.push({icon:iconChoice,en,fr});save();renderPanel()};$('backActions').onclick=()=>{view='actions';chosen.clear();render()};p.querySelectorAll('[data-remove-custom]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.removeCustom);ask('Delete good action?',`Delete ${customs[i].en}? Previous history will be kept.`,()=>{c.customActions.splice(i,1);save();renderPanel()})})}else if(view==='settings'){p.innerHTML=`<h2>⚙ ${tr('Settings','Paramètres')}</h2><label class="field"><span>${tr('Class name','Nom de classe')}</span><input id="name" maxlength="45" value="${esc(c.name)}"></label><label class="field"><span>${tr('Jar goal','Objectif')}</span><input id="goal" type="number" min="1" max="150" value="${c.goal}"></label><label class="field"><span>${tr('Reward','Récompense')}</span><input id="reward" maxlength="120" value="${esc(c.reward)}"></label><label class="field"><span>${tr('Jar style','Style de jarre')}</span><select id="style">${[['balls','Colorful balls'],['stars','Golden stars'],['books','Books'],['leaves','Leaves'],['gems','Gems']].map(([v,l])=>`<option value="${v}" ${c.style===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="check"><input type="checkbox" id="french" ${state.showFrench?'checked':''}>Show French subtitles</label><label class="check"><input type="checkbox" id="sound" ${state.sound?'checked':''}>Sound effects</label><div class="tools"><button class="tool" id="export">⇩ ${tr('Export backup','Exporter')}</button><button class="tool" id="import">⇧ ${tr('Import backup','Importer')}</button><button class="tool warn" id="reset">↻ ${tr('Reset this class','Réinitialiser')}</button></div><p class="hint">Changes are saved automatically on this device. Export a backup to move between devices or browsers.</p>`;['name','goal','reward','style'].forEach(id=>$(id).addEventListener('change',()=>{let v=$(id).value;if(id==='goal')v=Math.max(1,Math.min(150,Number(v)||20));c[id==='name'?'name':id]=v;if(c.points>c.goal)c.points=c.goal;render()}));$('french').onchange=e=>{state.showFrench=e.target.checked;render()};$('sound').onchange=e=>{state.sound=e.target.checked;render()};$('export').onclick=exportData;$('import').onclick=()=>$('importFile').click();$('reset').onclick=()=>ask('Reset this class?',`Reset ${c.name} to 0? Previous reward history will be kept.`,()=>{c.points=0;c.history.unshift({at:new Date().toISOString(),type:'reset'});render()})}else if(view==='classes'){p.innerHTML=`<h2>👥 ${tr('Manage Classes','Gestion des classes')}</h2><div class="list">${state.classes.map((x,i)=>`<div class="entry"><div><b>${esc(x.name)}</b><br><small>${x.points}/${x.goal} · ${x.rewards} rewards</small></div><div><button class="tool mini" data-pick="${i}">Open</button> <button class="tool mini warn" data-delete="${i}">✕</button></div></div>`).join('')}</div><label class="field"><span>${tr('New class','Nouvelle classe')}</span><input id="newName" maxlength="45" placeholder="e.g. Class 3B"></label><button class="tool" id="newClass">＋ Add class</button><p class="hint">Create as many classes as you need. Each class has its own jar, goal, reward and history.</p>`;p.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.pick;view='settings';render()});p.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const i=+b.dataset.delete;if(state.classes.length===1){alert('Keep at least one class.');return}ask('Delete class?',`Permanently delete ${state.classes[i].name} and its history?`,()=>{state.classes.splice(i,1);state.selected=Math.min(state.selected,state.classes.length-1);render()})});$('newClass').onclick=()=>{const n=$('newName').value.trim();if(!n)return;state.classes.push(makeClass(n));state.selected=state.classes.length-1;view='settings';render()}}else if(view==='history'){p.innerHTML=`<h2>📖 ${tr('History','Historique')}</h2><p>${esc(c.name)} · ${c.history.length} events</p><div class="list">${c.history.length?c.history.map(h=>`<div class="entry"><span>${h.type==='add'?'⭐ '+esc(h.label||'Good action'):h.type==='undo'?'↶ Action removed':h.type==='reward'?'🏆 Reward earned':'↻ Jar reset'}</span><small>${new Date(h.at).toLocaleString()}</small></div>`).join(''):'<p class="empty">No actions yet.</p>'}</div><div class="tools"><button class="tool" id="undo">↶ Undo last action</button></div>`;$('undo').onclick=undo}else{const ri=Number.isInteger(c.rewardIcon)&&c.rewardIcon>=0&&c.rewardIcon<REWARD_ICONS.length?c.rewardIcon:3;p.innerHTML=`<h2>🏆 ${tr('Rewards','Récompenses')}</h2><div class="reward-preview">${rewardArt(ri)}<span class="reward-symbol">${REWARD_ICONS[ri][0]}</span><div><b>${esc(c.reward)}</b><br><small>${esc(REWARD_ICONS[ri][1])}</small></div></div><p class="reward-gallery-label">${tr('Choose a reward icon','Choisir une icône de récompense')}</p><div class="reward-gallery">${REWARD_ICONS.map(([icon,name],i)=>`<button type="button" class="reward-choice ${ri===i?'selected':''}" data-reward-icon="${i}" aria-label="${esc(name)}" aria-pressed="${ri===i}">${rewardArt(i)}<span class="reward-symbol">${icon}</span><small>${esc(name)}</small></button>`).join('')}</div><label class="field"><span>${tr('Reward name','Nom de la récompense')}</span><input id="rewardName" maxlength="120" value="${esc(c.reward)}"></label><p><b>${tr('Rewards earned','Récompenses obtenues')}:</b> ${c.rewards}</p><p><b>${tr('Current progress','Progression actuelle')}:</b> ${c.points} / ${c.goal}</p><p class="hint">When the jar reaches its goal, confirm the reward to start a new jar.</p><div class="list">${c.history.filter(x=>x.type==='reward').map(x=>`<div class="entry">${REWARD_ICONS[Number.isInteger(x.rewardIcon)?x.rewardIcon:3]?.[0]||'🏆'} ${esc(x.reward||'Reward')}<small>${new Date(x.at).toLocaleDateString()}</small></div>`).join('')||'<p class="empty">No rewards earned yet.</p>'}</div>`;p.querySelectorAll('[data-reward-icon]').forEach(b=>b.onclick=()=>{c.rewardIcon=Number(b.dataset.rewardIcon);render()});$('rewardName').onchange=e=>{c.reward=e.target.value.trim()||'Class choice activity';render()};activateRewardArt()}}function ask(title,msg,fn){$('modalTitle').textContent=title;$('modalText').textContent=msg;confirmAction=fn;$('modal').classList.remove('hidden')}function close(){confirmAction=null;$('modal').classList.add('hidden')}$('modalCancel').onclick=close;$('modalConfirm').onclick=()=>{const fn=confirmAction;close();fn&&fn()};function add(actionLabel='Good action'){const c=current();if(c.points>=c.goal)return;c.points++;c.history.unshift({type:'add',label:actionLabel,at:new Date().toISOString()});$('jar').classList.remove('pop');void $('jar').offsetWidth;$('jar').classList.add('pop');sound();render();if(c.points===c.goal)ask('🎉 Goal reached!',`${c.name} earned: ${c.reward}. Record the reward and start a fresh jar?`,()=>{c.rewards++;c.history.unshift({type:'reward',reward:c.reward,at:new Date().toISOString()});c.points=0;render()})}function undo(){const c=current();if(c.points<=0)return;c.points--;c.history.unshift({type:'undo',at:new Date().toISOString()});render()}function exportData(){const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='class-reward-jars-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.classes)||!x.classes.length||x.classes.length>500||x.classes.some(c=>typeof c.name!=='string'||!Number.isInteger(c.goal)||c.goal<1||c.goal>150||!Number.isInteger(c.points)||c.points<0||c.points>c.goal||!Array.isArray(c.history)))throw Error('Invalid backup');ask('Import backup?',`Replace current data with ${x.classes.length} classes?`,()=>{state={classes:x.classes,selected:0,showFrench:!!x.showFrench,sound:x.sound!==false};render()})}catch{alert('Invalid backup file.')}e.target.value=''};$('classSelect').onchange=e=>{state.selected=+e.target.value;chosen.clear();render()};$('prev').onclick=()=>{state.selected=(state.selected-1+state.classes.length)%state.classes.length;render()};$('next').onclick=()=>{state.selected=(state.selected+1)%state.classes.length;render()};$('add').onclick=()=>add();$('settingsBtn').onclick=()=>{view='settings';render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});const logo=document.getElementById('brandLogo');logo.onload=()=>logo.closest('.top').classList.add('logo-loaded');logo.onerror=()=>logo.closest('.top').classList.remove('logo-loaded');if(logo.complete&&logo.naturalWidth)logo.onload();render();})();
</script></body></html>
